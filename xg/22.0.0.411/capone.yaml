AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Capone Deployment - Sophos Firewall distributed architecture with a Queen
  controller, GWLB-backed worker inspection fleet, and a spoke VPC.
  This is the main orchestration template that launches nested stacks.

Parameters:
  AMI:
    Description: Specify the Sophos Firewall AMI ID.
    Type: AWS::EC2::Image::Id
    Default: ami-abcdef12345678900
    AllowedPattern: '^(ami-[0-9a-f]{8}|ami-[0-9a-f]{17})$'
  AvailabilityZone1:
    Type: 'AWS::EC2::AvailabilityZone::Name'
    Description: Primary Availability Zone.
    ConstraintDescription: Must be a valid AZ code
    AllowedPattern: \S+
  AvailabilityZone2:
    Type: 'AWS::EC2::AvailabilityZone::Name'
    Description: Secondary Availability Zone (used by inspection and spoke VPCs).
    ConstraintDescription: Must be a valid AZ code
    AllowedPattern: \S+
  ControlVpcNetworkPrefix:
    Description: >-
      /16 CIDR prefix for the Control VPC (queen). Only the first two octets.
    Type: String
    Default: '10.0'
    ConstraintDescription: 'Must be notation like: X.X'
    AllowedPattern: >-
      ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).)(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)
  InspectionVpcNetworkPrefix:
    Description: >-
      /16 CIDR prefix for the Inspection VPC (workers). Only the first two octets.
    Type: String
    Default: '10.1'
    ConstraintDescription: 'Must be notation like: X.X'
    AllowedPattern: >-
      ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).)(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)
  TrustedNetworkCIDR:
    Description: Allow all traffic (including SSH and admin) from this CIDR.
    Type: String
    AllowedPattern: >-
      ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(/(2[4-9]|3[0-2]))$
    ConstraintDescription: Must be a valid IPv4 CIDR within range /24 to /32
  ConnectionAcceptance:
    Description: Whether GWLB Endpoint Service connections require manual acceptance.
    Default: "true"
    AllowedValues: ["true", "false"]
    Type: String
    ConstraintDescription: Must be true or false
  QueenInstanceSize:
    Description: EC2 instance type for the Queen firewall.
    Type: String
    Default: m7i.large
    AllowedValues:
      - t3.medium
      - m4.large
      - m4.xlarge
      - m4.2xlarge
      - m5.large
      - m5.xlarge
      - m5.2xlarge
      - m7i.large
      - m7i.xlarge
      - m7i.2xlarge
      - m7i.4xlarge
      - c4.large
      - c4.xlarge
      - c4.2xlarge
      - c5.large
      - c5.xlarge
      - c5.2xlarge
  WorkerInstanceSize:
    Description: EC2 instance type for Worker firewalls in the inspection VPC.
    Type: String
    Default: m7i.large
    AllowedValues:
      - t3.medium
      - m4.large
      - m4.xlarge
      - m4.2xlarge
      - m5.large
      - m5.xlarge
      - m5.2xlarge
      - m7i.large
      - m7i.xlarge
      - m7i.2xlarge
      - m7i.4xlarge
      - c4.large
      - c4.xlarge
      - c4.2xlarge
      - c4.4xlarge
      - c4.8xlarge
      - c5.large
      - c5.xlarge
      - c5.2xlarge
      - c5.4xlarge
      - c5.9xlarge
      - c5.12xlarge
      - c5.18xlarge
  KeyName:
    Type: 'AWS::EC2::KeyPair::KeyName'
    Description: Name of an existing EC2 KeyPair to enable SSH access.
    ConstraintDescription: Must not be empty
    AllowedPattern: \S+
  BasicAdminPassword:
    Description: >-
      Must be at least 10 characters. At least 1 lowercase and 1 uppercase
      letter. At least one numeric character. At least one special character.
    Type: String
    NoEcho: 'True'
    ConstraintDescription: >-
      Must be at least 10 characters. At least 1 lowercase and 1 uppercase
      letter. At least one numeric character. At least one special character.
    AllowedPattern: '^(?=.*[0-9])(?=.*[^A-Za-z0-9])(?=.*[a-z])(?=.*[A-Z])(?=(.*)).{10,60}$'
  SSMKPassword:
    Description: >-
      Must be at least 12 and at most 250 characters long. At least 1 lowercase
      and 1 uppercase letter. At least one numeric character. At least one
      special character.
    Type: String
    NoEcho: 'True'
    ConstraintDescription: >-
      Must be at least 12 and at most 250 characters long. At least 1 lowercase
      and 1 uppercase letter. At least one numeric character. At least one
      special character.
    AllowedPattern: '^(?=.*[0-9])(?=.*[^A-Za-z0-9])(?=.*[a-z])(?=.*[A-Z])(?=(.*)).{12,250}$'
  ConfigurationBackupPassword:
    Description: >-
      Password for configuration backup and restore. Must be at least 10
      characters. At least 1 lowercase and 1 uppercase letter. At least one
      numeric character. At least one special character.
    Type: String
    NoEcho: 'True'
    ConstraintDescription: >-
      Must be at least 10 characters. At least 1 lowercase and 1 uppercase
      letter. At least one numeric character. At least one special character.
    AllowedPattern: '^(?=.*[0-9])(?=.*[^A-Za-z0-9])(?=.*[a-z])(?=.*[A-Z])(?=(.*)).{10,60}$'
  AutoscaleMinCapacity:
    Description: Minimum number of worker firewalls in the autoscaling group.
    Type: Number
    Default: '1'
    MinValue: '1'
    MaxValue: '65535'
    ConstraintDescription: Must be between 1 and 65535.
  AutoscaleDesiredCapacity:
    Description: Starting number of worker firewalls. Recommended equal to MaxCapacity.
    Type: Number
    Default: '4'
    MinValue: '1'
    MaxValue: '65535'
    ConstraintDescription: Must be between 1 and 65535.
  AutoscaleMaxCapacity:
    Description: Maximum number of worker firewalls in the autoscaling group.
    Type: Number
    Default: '4'
    MinValue: '1'
    MaxValue: '65535'
    ConstraintDescription: Must be between 1 and 65535.
  AutoscaleWarmpoolRefreshPeriod:
    Description: Period in days until the warm pool undergoes a refresh.
    Type: Number
    Default: '5'
    MinValue: '1'
    MaxValue: '14'
    ConstraintDescription: Valid range 1-14.
  AgreeUserTerms:
    Description: >-
      Use of this software is subject to the Sophos End User Terms of Use at
      https://www.sophos.com/en-us/legal/sophos-end-user-terms-of-use.
      You must enter 'yes' to accept the agreement to continue.
    Type: String
    AllowedPattern: '^(?i:yes)$'
  EnableCloudWatch:
    Description: View and store logs through AWS CloudWatch
    Type: String
    AllowedValues:
      - 'yes'
      - 'no'
    Default: 'no'
  SendLearningStats:
    Description: Learning how customers use Sophos Firewall helps make better products.
    Type: String
    AllowedValues:
      - 'on'
      - 'off'
    Default: 'on'
  NestedTemplateBaseURL:
    Description: >-
      S3 HTTPS URL where nested templates are hosted (no trailing slash).
      Example: https://my-bucket.s3.amazonaws.com/templates/22.0.0.411
    Type: String
    ConstraintDescription: Must be a valid S3 HTTPS URL
  SpokeVpcCidr:
    Description: CIDR block for the Spoke VPC
    Type: String
    Default: '10.2.0.0/24'
  SpokeApplicationSubnet1Cidr:
    Description: CIDR for Spoke Application Subnet 1 (AZ1)
    Type: String
    Default: '10.2.0.32/28'
  SpokeApplicationSubnet2Cidr:
    Description: CIDR for Spoke Application Subnet 2 (AZ2)
    Type: String
    Default: '10.2.0.48/28'
  SpokeGwlbeSubnet1Cidr:
    Description: CIDR for Spoke GWLBE Subnet 1 (AZ1)
    Type: String
    Default: '10.2.0.0/28'
  SpokeGwlbeSubnet2Cidr:
    Description: CIDR for Spoke GWLBE Subnet 2 (AZ2)
    Type: String
    Default: '10.2.0.16/28'
  SpokeApplicationAmiId:
    Description: AMI ID for application instances in the Spoke VPC
    Type: AWS::EC2::Image::Id
    Default: ami-abcdef12345678900
    AllowedPattern: '^(ami-[0-9a-f]{8}|ami-[0-9a-f]{17})$'
Rules:
  AvailabilityZoneCheck:
    RuleCondition: !And
      - !Not
        - !Equals
          - !Ref AvailabilityZone1
          - ''
      - !Not
        - !Equals
          - !Ref AvailabilityZone2
          - ''
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref AvailabilityZone1
            - !Ref AvailabilityZone2
        AssertDescription: Availability Zones have to be unique

Metadata:
  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: Cloud Infrastructure Configuration
        Parameters:
          - AMI
          - AvailabilityZone1
          - AvailabilityZone2
          - ControlVpcNetworkPrefix
          - InspectionVpcNetworkPrefix
          - TrustedNetworkCIDR
          - ConnectionAcceptance
          - KeyName
      - Label:
          default: Sophos Firewall Passwords
        Parameters:
          - BasicAdminPassword
          - SSMKPassword
          - ConfigurationBackupPassword
      - Label:
          default: Queen Configuration
        Parameters:
          - QueenInstanceSize
      - Label:
          default: Worker / Inspection Configuration
        Parameters:
          - WorkerInstanceSize
          - AutoscaleMinCapacity
          - AutoscaleDesiredCapacity
          - AutoscaleMaxCapacity
          - AutoscaleWarmpoolRefreshPeriod
      - Label:
          default: Spoke VPC Configuration
        Parameters:
          - SpokeVpcCidr
          - SpokeApplicationSubnet1Cidr
          - SpokeApplicationSubnet2Cidr
          - SpokeGwlbeSubnet1Cidr
          - SpokeGwlbeSubnet2Cidr
          - SpokeApplicationAmiId
      - Label:
          default: Deployment
        Parameters:
          - NestedTemplateBaseURL
          - AgreeUserTerms
          - EnableCloudWatch
          - SendLearningStats
    ParameterLabels:
      AMI:
        default: Sophos Firewall AMI ID (required)
      AvailabilityZone1:
        default: Availability Zone 1 (required)
      AvailabilityZone2:
        default: Availability Zone 2 (required)
      ControlVpcNetworkPrefix:
        default: Control VPC Network Prefix (required)
      InspectionVpcNetworkPrefix:
        default: Inspection VPC Network Prefix (required)
      TrustedNetworkCIDR:
        default: Trusted Network CIDR (required)
      ConnectionAcceptance:
        default: GWLB Endpoint Service Manual Acceptance
      QueenInstanceSize:
        default: Queen Instance Size (required)
      WorkerInstanceSize:
        default: Worker Instance Size (required)
      KeyName:
        default: SSH KeyPair Name (required)
      BasicAdminPassword:
        default: Admin Password (required)
      SSMKPassword:
        default: Secure Storage Master Key Password (required)
      ConfigurationBackupPassword:
        default: Configuration Backup Password (required)
      AutoscaleMinCapacity:
        default: Minimum Worker Capacity (required)
      AutoscaleDesiredCapacity:
        default: Starting Worker Capacity (required)
      AutoscaleMaxCapacity:
        default: Maximum Worker Capacity (required)
      AutoscaleWarmpoolRefreshPeriod:
        default: Warm Pool Refresh Period (required)
      AgreeUserTerms:
        default: I accept the Sophos EULA and Privacy Policy (required)
      EnableCloudWatch:
        default: Use CloudWatch
      SendLearningStats:
        default: Customer experience improvement program (required)
      NestedTemplateBaseURL:
        default: Nested Template S3 Base URL (required)
      SpokeVpcCidr:
        default: Spoke VPC CIDR
      SpokeApplicationSubnet1Cidr:
        default: Spoke App Subnet 1 CIDR
      SpokeApplicationSubnet2Cidr:
        default: Spoke App Subnet 2 CIDR
      SpokeGwlbeSubnet1Cidr:
        default: Spoke GWLBE Subnet 1 CIDR
      SpokeGwlbeSubnet2Cidr:
        default: Spoke GWLBE Subnet 2 CIDR
      SpokeApplicationAmiId:
        default: Spoke Application AMI ID
Resources:
# ========================= Shared Secrets =====================================
  PasswordSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: !Sub "capone-admin-pwd-${AWS::StackName}"
      Description: Sophos Firewall admin password
      SecretString: !Ref BasicAdminPassword
      Tags:
        - Key: Name
          Value: !Sub "Capone-AdminPwd-${AWS::StackName}"

  SSMKPasswordSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: !Sub "capone-ssmk-pwd-${AWS::StackName}"
      Description: Sophos Firewall Secure Storage Master Key
      SecretString: !Ref SSMKPassword
      Tags:
        - Key: Name
          Value: !Sub "Capone-SSMKPwd-${AWS::StackName}"

  BackupPasswordSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: !Sub "capone-backup-pwd-${AWS::StackName}"
      Description: Sophos Firewall configuration backup password
      SecretString: !Ref ConfigurationBackupPassword
      Tags:
        - Key: Name
          Value: !Sub "Capone-BackupPwd-${AWS::StackName}"

# ========================= S3 Config Bucket ===================================
  ConfigBucket:
    Type: AWS::S3::Bucket
    DependsOn: ConfigNotificationQueuePolicy
    Properties:
      BucketName: !Sub "capone-config-${AWS::StackName}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt ConfigNotificationQueue.Arn
          - Event: 's3:ObjectRemoved:*'
            Queue: !GetAtt ConfigNotificationQueue.Arn
      Tags:
        - Key: Name
          Value: !Sub "Capone-ConfigBucket-${AWS::StackName}"

# ========================= SQS Notification Queue =============================
  ConfigNotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "capone-config-notify-${AWS::StackName}"
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400
      Tags:
        - Key: Name
          Value: !Sub "Capone-ConfigNotifyQueue-${AWS::StackName}"

  ConfigNotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ConfigNotificationQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Notification
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: 'sqs:SendMessage'
            Resource: !GetAtt ConfigNotificationQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::capone-config-${AWS::StackName}-${AWS::AccountId}"

# ========================= Nested Stack: Queen (Control VPC) ==================
  QueenStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${NestedTemplateBaseURL}/capone-control-vpc.yaml"
      Parameters:
        AMI: !Ref AMI
        AvailabilityZone1: !Ref AvailabilityZone1
        NetworkPrefix: !Ref ControlVpcNetworkPrefix
        TrustedNetworkCIDR: !Ref TrustedNetworkCIDR
        InstanceSize: !Ref QueenInstanceSize
        KeyName: !Ref KeyName
        SophosFirewallName: Sophos-Queen
        PasswordSecretArn: !Ref PasswordSecret
        SSMKPasswordSecretArn: !Ref SSMKPasswordSecret
        BackupPasswordSecretArn: !Ref BackupPasswordSecret
        ConfigBucketName: !Ref ConfigBucket
        ConfigBucketArn: !GetAtt ConfigBucket.Arn
        EnableCloudWatch: !Ref EnableCloudWatch
        SendLearningStats: !Ref SendLearningStats
      Tags:
        - Key: Name
          Value: !Sub "Capone-QueenStack-${AWS::StackName}"

# ========================= Nested Stack: Inspection VPC (Workers) =============
  InspectionStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${NestedTemplateBaseURL}/capone-inspection-vpc.yaml"
      Parameters:
        AMI: !Ref AMI
        AvailabilityZone1: !Ref AvailabilityZone1
        AvailabilityZone2: !Ref AvailabilityZone2
        NetworkPrefix: !Ref InspectionVpcNetworkPrefix
        TrustedNetworkCIDR: !Ref TrustedNetworkCIDR
        ConnectionAcceptance: !Ref ConnectionAcceptance
        InstanceSize: !Ref WorkerInstanceSize
        KeyName: !Ref KeyName
        SophosFirewallName: Sophos-Worker
        PasswordSecretArn: !Ref PasswordSecret
        SSMKPasswordSecretArn: !Ref SSMKPasswordSecret
        BackupPasswordSecretArn: !Ref BackupPasswordSecret
        ConfigBucketName: !Ref ConfigBucket
        ConfigBucketArn: !GetAtt ConfigBucket.Arn
        NotificationQueueUrl: !Ref ConfigNotificationQueue
        NotificationQueueArn: !GetAtt ConfigNotificationQueue.Arn
        AutoscaleMinCapacity: !Ref AutoscaleMinCapacity
        AutoscaleDesiredCapacity: !Ref AutoscaleDesiredCapacity
        AutoscaleMaxCapacity: !Ref AutoscaleMaxCapacity
        AutoscaleWarmpoolRefreshPeriod: !Ref AutoscaleWarmpoolRefreshPeriod
        EnableCloudWatch: !Ref EnableCloudWatch
        SendLearningStats: !Ref SendLearningStats
      Tags:
        - Key: Name
          Value: !Sub "Capone-InspectionStack-${AWS::StackName}"

# ========================= Nested Stack: Spoke VPC ============================
  SpokeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: InspectionStack
    Properties:
      TemplateURL: !Sub "${NestedTemplateBaseURL}/capone-spoke-vpc.yaml"
      Parameters:
        VpcCidr: !Ref SpokeVpcCidr
        AvailabilityZone1: !Ref AvailabilityZone1
        AvailabilityZone2: !Ref AvailabilityZone2
        ApplicationSubnet1Cidr: !Ref SpokeApplicationSubnet1Cidr
        ApplicationSubnet2Cidr: !Ref SpokeApplicationSubnet2Cidr
        GwlbeSubnet1Cidr: !Ref SpokeGwlbeSubnet1Cidr
        GwlbeSubnet2Cidr: !Ref SpokeGwlbeSubnet2Cidr
        ApplicationInstanceType: t3.medium
        ApplicationAmiId: !Ref SpokeApplicationAmiId
        ApplicationInstanceDiskSize: '8'
        KeyPairName: !Ref KeyName
        AccessLocation: !Ref TrustedNetworkCIDR
        CreateBastionCondition: 'No'
        ServiceName: !GetAtt InspectionStack.Outputs.GwlbEndpointServiceName
      Tags:
        - Key: Name
          Value: !Sub "Capone-SpokeStack-${AWS::StackName}"
Outputs:
  QueenElasticIP:
    Description: >-
      Elastic IP of the Queen firewall. Use as bastion entry point for SSH
      access to worker firewalls in the inspection VPC.
    Value: !GetAtt QueenStack.Outputs.QueenElasticIPAddress
  ControlVpcId:
    Description: Control VPC ID (Queen)
    Value: !GetAtt QueenStack.Outputs.ControlVpcId
  InspectionVpcGwlbEndpointServiceName:
    Description: >-
      GWLB Endpoint Service Name from inspection VPC. Use to create GWLB
      endpoints in additional spoke VPCs.
    Value: !GetAtt InspectionStack.Outputs.GwlbEndpointServiceName
  InspectionVpcGwlbEndpointServiceId:
    Description: GWLB Endpoint Service ID
    Value: !GetAtt InspectionStack.Outputs.GwlbEndpointServiceId
  ConfigBucketName:
    Description: S3 bucket for configuration backups. Queen writes, workers read.
    Value: !Ref ConfigBucket
  ConfigNotificationQueueUrl:
    Description: SQS queue URL for S3 change notifications to workers
    Value: !Ref ConfigNotificationQueue
  PasswordSecretArn:
    Description: ARN of admin password secret in Secrets Manager
    Value: !Ref PasswordSecret
  SSMKPasswordSecretArn:
    Description: ARN of SSMK password secret in Secrets Manager
    Value: !Ref SSMKPasswordSecret
  BackupPasswordSecretArn:
    Description: ARN of backup password secret in Secrets Manager
    Value: !Ref BackupPasswordSecret
