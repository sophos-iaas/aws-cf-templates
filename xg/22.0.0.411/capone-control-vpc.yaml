AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Sophos Firewall Queen in Control VPC (self-healing singleton).
  Nested template (capone-control-vpc.yaml) launched by capone.yaml.
Parameters:
  AMI:
    Description: Specify an AMI ID.
    Type: AWS::EC2::Image::Id
    Default: ami-abcdef12345678900
    AllowedPattern: '^(ami-[0-9a-f]{8}|ami-[0-9a-f]{17})$'
  AvailabilityZone1:
    Type: 'AWS::EC2::AvailabilityZone::Name'
    Description: Availability Zone for the Control VPC.
    ConstraintDescription: Must be a valid AZ code
    AllowedPattern: \S+
  NetworkPrefix:
    Description: >-
      Private /16 CIDR block for the Control VPC. Only the first two octets
      are required.
    Type: String
    Default: '10.0'
    ConstraintDescription: 'Must be notation like: X.X'
    AllowedPattern: >-
      ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).)(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)
  TrustedNetworkCIDR:
    Description: >-
      Allow all traffic (including TCP port 22 and 4444) from this CIDR to
      the Control VPC.
    Type: String
    AllowedPattern: >-
      ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(/(2[4-9]|3[0-2]))$
    ConstraintDescription: Must be a valid IPv4 CIDR within range /24 to /32
  InstanceSize:
    Description: EC2 instance type for the Queen firewall.
    Type: String
    Default: m7i.large
    AllowedValues:
      - t3.medium
      - m4.large
      - m4.xlarge
      - m4.2xlarge
      - m5.large
      - m5.xlarge
      - m5.2xlarge
      - m7i.large
      - m7i.xlarge
      - m7i.2xlarge
      - m7i.4xlarge
      - c4.large
      - c4.xlarge
      - c4.2xlarge
      - c4.4xlarge
      - c4.8xlarge
      - c5.large
      - c5.xlarge
      - c5.2xlarge
      - c5.4xlarge
      - c5.9xlarge
      - c5.12xlarge
      - c5.18xlarge
  KeyName:
    Type: 'AWS::EC2::KeyPair::KeyName'
    Description: Name of an existing EC2 KeyPair to enable SSH access.
    ConstraintDescription: Must not be empty
    AllowedPattern: \S+
  SophosFirewallName:
    Description: Name tag for the Queen Sophos Firewall.
    Type: String
    Default: Sophos-Queen
    ConstraintDescription: Must not be empty or more than 255 characters
    AllowedPattern: \S+
    MaxLength: 255
  PasswordSecretArn:
    Description: ARN of the Secrets Manager secret storing the admin password
    Type: String
  SSMKPasswordSecretArn:
    Description: ARN of the Secrets Manager secret storing the SSMK password
    Type: String
  BackupPasswordSecretArn:
    Description: ARN of the Secrets Manager secret storing the configuration backup password
    Type: String
  ConfigBucketName:
    Description: Name of the S3 bucket for configuration backups
    Type: String
  ConfigBucketArn:
    Description: ARN of the S3 bucket for configuration backups
    Type: String
  EnableCloudWatch:
    Description: View and store logs through AWS CloudWatch
    Type: String
    AllowedValues:
      - 'yes'
      - 'no'
    Default: 'no'
  SendLearningStats:
    Description: Opt in to the customer experience improvement program
    Type: String
    AllowedValues:
      - 'on'
      - 'off'
    Default: 'on'
Metadata:
  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: Cloud Infrastructure Configuration
        Parameters:
          - AMI
          - InstanceSize
          - AvailabilityZone1
          - NetworkPrefix
          - TrustedNetworkCIDR
      - Label:
          default: Queen Firewall Configuration
        Parameters:
          - SophosFirewallName
          - KeyName
          - EnableCloudWatch
          - SendLearningStats
      - Label:
          default: Shared Resource References (from parent stack)
        Parameters:
          - PasswordSecretArn
          - SSMKPasswordSecretArn
          - BackupPasswordSecretArn
          - ConfigBucketName
          - ConfigBucketArn
    ParameterLabels:
      AMI:
        default: AMI ID (required)
      InstanceSize:
        default: Instance Size (required)
      AvailabilityZone1:
        default: AvailabilityZone for deployment (required)
      NetworkPrefix:
        default: Network Address Prefix for Control VPC (required)
      TrustedNetworkCIDR:
        default: Trusted Network CIDR (required)
      KeyName:
        default: SSH KeyPair Name (required)
      SophosFirewallName:
        default: Queen Firewall Name (required)
      PasswordSecretArn:
        default: Admin Password Secret ARN
      SSMKPasswordSecretArn:
        default: SSMK Password Secret ARN
      BackupPasswordSecretArn:
        default: Backup Password Secret ARN
      ConfigBucketName:
        default: Config S3 Bucket Name
      ConfigBucketArn:
        default: Config S3 Bucket ARN
      EnableCloudWatch:
        default: Use CloudWatch
      SendLearningStats:
        default: Opt in to the customer experience improvement program
Conditions:
  UsingCloudWatch: !Not
    - !Equals
      - !Ref EnableCloudWatch
      - 'no'
Resources:
# ----------------------------- Control VPC ------------------------------------#
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      CidrBlock: !Join
        - .
        - - !Ref NetworkPrefix
          - 0.0/16
      Tags:
        - Key: Name
          Value: !Sub "Capone-Control-VPC-${AWS::StackName}"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "Capone-Control-IGW-${AWS::StackName}"

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: 'AWS::EC2::Subnet'
    DependsOn: AttachInternetGateway
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Join
        - .
        - - !Ref NetworkPrefix
          - 1.0/24
      AvailabilityZone: !Ref AvailabilityZone1
      MapPublicIpOnLaunch: 'true'
      Tags:
        - Key: Name
          Value: !Sub "Capone-Control-Subnet-${AWS::StackName}"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "Capone-Control-RT-${AWS::StackName}"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  SubnetRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

# ----------------------------- Security Group ---------------------------------#
  SecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable access from trusted network to Queen firewall
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: !Ref TrustedNetworkCIDR
        - IpProtocol: ICMP
          FromPort: -1
          ToPort: -1
          CidrIp: !Ref TrustedNetworkCIDR
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: !Join
            - .
            - - !Ref NetworkPrefix
              - 0.0/16
      SecurityGroupEgress:
        - IpProtocol: '-1'
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "Capone-Queen-SG-${AWS::StackName}"

# ----------------------------- Elastic IP -------------------------------------#
  QueenElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "Capone-Queen-EIP-${AWS::StackName}"

# ----------------------------- EIP Association Lambda -------------------------#
  EIPAssociationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "queen-eip-lambda-role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: EIPAssociationPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - ec2:AssociateAddress
                  - ec2:DescribeAddresses
                  - ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action:
                  - autoscaling:CompleteLifecycleAction
                Resource: "*"

  EIPAssociationLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt EIPAssociationLambdaRole.Arn
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          EIP_ALLOCATION_ID: !GetAtt QueenElasticIP.AllocationId
      Code:
        ZipFile: |
          import boto3
          import logging
          import os
          import time
          def handler(event, context):
              logger = logging.getLogger()
              logger.setLevel(logging.INFO)
              logger.info('EIP Association event: {}'.format(event))
              detail = event.get('detail', {})
              instance_id = detail.get('EC2InstanceId')
              asg_name = detail.get('AutoScalingGroupName')
              hook_name = detail.get('LifecycleHookName')
              lifecycle_token = detail.get('LifecycleActionToken')
              if not instance_id:
                  logger.error('No EC2InstanceId in event')
                  return
              allocation_id = os.environ['EIP_ALLOCATION_ID']
              ec2 = boto3.client('ec2')
              autoscaling = boto3.client('autoscaling')
              for attempt in range(12):
                  try:
                      resp = ec2.describe_instances(InstanceIds=[instance_id])
                      state = resp['Reservations'][0]['Instances'][0]['State']['Name']
                      if state == 'running':
                          break
                  except Exception:
                      pass
                  time.sleep(10)
              try:
                  ec2.associate_address(
                      AllocationId=allocation_id,
                      InstanceId=instance_id,
                      AllowReassociation=True
                  )
                  logger.info('EIP associated to {}'.format(instance_id))
              except Exception as e:
                  logger.error('EIP association failed: {}'.format(e))
              try:
                  autoscaling.complete_lifecycle_action(
                      LifecycleHookName=hook_name,
                      AutoScalingGroupName=asg_name,
                      LifecycleActionToken=lifecycle_token,
                      LifecycleActionResult='CONTINUE'
                  )
              except Exception as e:
                  logger.error('Lifecycle completion failed: {}'.format(e))
      Tags:
        - Key: Name
          Value: !Sub "Capone-EIP-Lambda-${AWS::StackName}"

  EIPAssociationEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Trigger EIP association on Queen ASG instance launch
      State: ENABLED
      EventPattern:
        source:
          - aws.autoscaling
        detail-type:
          - "EC2 Instance-launch Lifecycle Action"
        detail:
          AutoScalingGroupName:
            - !Join
              - '-'
              - - !Ref 'AWS::StackName'
                - queen-asg
      Targets:
        - Arn: !GetAtt EIPAssociationLambda.Arn
          Id: AssociateQueenEIP

  EIPAssociationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EIPAssociationLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EIPAssociationEventRule.Arn

# ----------------------------- AutoScaling (Singleton) ------------------------#
  QueenAutoScalingGroup:
    Type: 'AWS::AutoScaling::AutoScalingGroup'
    Properties:
      AutoScalingGroupName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - queen-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref QueenLaunchTemplate
        Version: !GetAtt QueenLaunchTemplate.LatestVersionNumber
      MinSize: '1'
      DesiredCapacity: '1'
      MaxSize: '1'
      Cooldown: 300
      AvailabilityZones:
        - !Ref AvailabilityZone1
      HealthCheckType: EC2
      HealthCheckGracePeriod: 600
      LifecycleHookSpecificationList:
        - DefaultResult: CONTINUE
          HeartbeatTimeout: 300
          LifecycleHookName: QueenEIPAssociation
          LifecycleTransition: autoscaling:EC2_INSTANCE_LAUNCHING
      VPCZoneIdentifier:
        - !Ref PublicSubnet
      TerminationPolicies:
        - Default
      Tags:
        - Key: Name
          Value: !Ref SophosFirewallName
          PropagateAtLaunch: true

# ----------------------------- Launch Template --------------------------------#
  QueenLaunchTemplate:
    Type: 'AWS::EC2::LaunchTemplate'
    Properties:
      LaunchTemplateName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - QueenLT
      LaunchTemplateData:
        InstanceType: !Ref InstanceSize
        KeyName: !Ref KeyName
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Ref SophosFirewallName
        NetworkInterfaces:
          - DeleteOnTermination: true
            Description: ENI for Queen Public Subnet
            DeviceIndex: '0'
            Groups:
              - !Ref SecurityGroup
        ImageId: !Ref AMI
        IamInstanceProfile:
          Name: !Ref QueenInstanceProfile
        UserData: !Base64
          'Fn::Join':
            - ''
            - - '{'
              - '"hostname":"sophos-queen",'
              - '"sendstats":"'
              - !Ref SendLearningStats
              - '",'
              - '"region":"'
              - !Ref 'AWS::Region'
              - '",'
              - '"secretId":"'
              - !Ref PasswordSecretArn
              - '",'
              - '"acceptedEULA":"'
              - 'yes'
              - '",'
              - '"enableCloudWatch":"'
              - !Ref EnableCloudWatch
              - '",'
              - '"ssmkSecretId":"'
              - !Ref SSMKPasswordSecretArn
              - '",'
              - '"backupSecretId":"'
              - !Ref BackupPasswordSecretArn
              - '",'
              - '"configBucketName":"'
              - !Ref ConfigBucketName
              - '",'
              - '"nodeRole":"queen"'
              - |
                }

# ----------------------------- IAM --------------------------------------------#
  QueenInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Path: /
      Roles:
        - !Ref QueenIAMRole

  QueenIAMPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: QueenIAMPolicy
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:DescribeSecret'
            Resource:
              - !Ref PasswordSecretArn
              - !Ref SSMKPasswordSecretArn
              - !Ref BackupPasswordSecretArn
          - Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:DeleteObject'
              - 's3:ListBucket'
            Resource:
              - !Ref ConfigBucketArn
              - !Sub "${ConfigBucketArn}/*"
          - Effect: Allow
            Action:
              - 'autoscaling:DescribeAutoScalingInstances'
              - 'ec2:DescribeNetworkInterfaces'
              - 'tag:GetResources'
            Resource:
              - '*'
      Roles:
        - !Ref QueenIAMRole

  QueenIAMPolicyForCloudWatch:
    Type: AWS::IAM::Policy
    Condition: UsingCloudWatch
    Properties:
      PolicyName: QueenIAMPolicyForCloudWatch
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'logs:Create*'
              - 'logs:PutLogEvents'
            Resource:
              - 'arn:aws:logs:*:*:*'
      Roles:
        - !Ref QueenIAMRole

  QueenIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub "queen-role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /

Outputs:
  QueenElasticIPAddress:
    Description: Elastic IP address of the Queen firewall (use as bastion)
    Value: !Ref QueenElasticIP
  ControlVpcId:
    Description: Control VPC ID
    Value: !Ref VPC
  ControlVpcCidr:
    Description: Control VPC CIDR block
    Value: !Join
      - .
      - - !Ref NetworkPrefix
        - 0.0/16
  PublicRouteTableId:
    Description: Control VPC Public Route Table ID
    Value: !Ref PublicRouteTable
  SecurityGroupId:
    Description: Control VPC Security Group ID
    Value: !Ref SecurityGroup
